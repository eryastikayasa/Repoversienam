[platformio]
src_dir = main

[env:esp32-s3-devkitc-1]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200

; Gunakan board_build agar terbaca oleh ESP-IDF compiler & partition tool
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions/partitions.csv

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L

; Paksa linker mempertahankan ESP-IDF x509 certificate bundle.
; websocket_mgr.cpp menggunakan esp_crt_bundle_attach, tetapi audit ELF
; harus memastikan payload bundle dan kedua boundary symbol benar-benar
; masuk ke firmware.elf.
build_flags =
    -Wl,--undefined=_binary_x509_crt_bundle_start
    -Wl,--undefined=_binary_x509_crt_bundle_end
