name: WakeNet9 Runtime Audit

on:
  workflow_run:
    workflows:
      - Build ESP32-S3 Firmware
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    name: Verify WakeNet9 Hi ESP
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout firmware source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          submodules: recursive

      - name: Download successful firmware artifact
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v4
        with:
          name: ESP32S3-Firmware-Full
          path: artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Audit WakeNet9 configuration and source
        shell: bash
        run: |
          set -euo pipefail
          echo "=== WAKENET9 HI ESP AUDIT ==="
          echo "--- sdkconfig.defaults ---"
          grep -E '^CONFIG_SR_WN_WN9_HIESP=y$' sdkconfig.defaults
          grep -E '^CONFIG_ESP32S3_SPIRAM_SUPPORT=y$' sdkconfig.defaults
          grep -E '^CONFIG_SPIRAM_MODE_OCT=y$' sdkconfig.defaults
          grep -E '^CONFIG_SPIRAM_SPEED_80M=y$' sdkconfig.defaults
          echo "--- source integration ---"
          WAKE_SRC=components/wakeword/wakeword.cpp
          test -f "$WAKE_SRC"
          grep -n 'MODEL_NAME\[\] = "wn9_hiesp"' "$WAKE_SRC"
          grep -n 'esp_srmodel_init("model")' "$WAKE_SRC"
          grep -n 'esp_srmodel_exists' "$WAKE_SRC"
          grep -n 'esp_wn_handle_from_name(MODEL_NAME)' "$WAKE_SRC"
          grep -n 's_iface->create(MODEL_NAME, DET_MODE_90)' "$WAKE_SRC"
          grep -n 'get_samp_chunksize' "$WAKE_SRC"
          grep -n 's_iface->detect(s_model, s_buffer)' "$WAKE_SRC"
          grep -n 'detected HI, ESP' "$WAKE_SRC"
          grep -n 'audio_hal_read_pcm' "$WAKE_SRC"
          grep -n 'xTaskCreate' "$WAKE_SRC"
          echo "--- model partition ---"
          grep -E '^model,.*0x400000' partitions/partitions.csv
          if [ -f artifacts/firmware.elf ]; then
            ELF=artifacts/firmware.elf
            echo "--- compiled ELF strings ---"
            strings "$ELF" | grep -F 'wn9_hiesp'
            strings "$ELF" | grep -F 'WakeNet ready: HI, ESP / DET_MODE_90'
            strings "$ELF" | grep -F 'detected HI, ESP (id='
            echo "Compiled WakeNet9 integration: PASS"
          else
            echo "No firmware artifact in manual audit; source/config checks passed."
          fi
          echo "========================================"
          echo "WAKENET9 HI ESP AUDIT: PASS"
          echo "Config + dedicated WakeWord runtime integration verified"
          echo "========================================"
